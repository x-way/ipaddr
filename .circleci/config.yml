version: 2.1
workflows:
  build:
    jobs:
      - build
  scheduled:
    triggers:
      - schedule:
          cron: "1 2 1 * *"
          filters:
            branches:
              only:
                - master
    jobs:
      - build

jobs:
  build:
    docker:
      - image: cimg/go:1.27

    steps:
      - checkout
      - run: uname -a
      - run: go version
      - run: go env
      - run: go vet -v ./...
      - run:
          name: staticcheck.io
          command: |
                    go install honnef.co/go/tools/cmd/staticcheck@latest
                    staticcheck -checks all ./...
      - run:
          name: govulncheck
          command: |
                    go install golang.org/x/vuln/cmd/govulncheck@latest
                    govulncheck ./...
      - run:
          name: gosec
          command: |
                    go install github.com/securego/gosec/v2/cmd/gosec@latest
                    gosec ./...
      - run:
          name: Check gofumpt formatting
          command: |
                    go install mvdan.cc/gofumpt@latest
                    gofumpt -d .
                    [ -z "$(gofumpt -l .)" ]
